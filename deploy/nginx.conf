# Rate-limit zones — applied per-location below. limit_req_zone must
# live in the http{} context; nginx merges this on reload alongside
# whatever is in /etc/nginx/nginx.conf.
limit_req_zone $binary_remote_addr zone=ps_wallet_link:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ps_events:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ps_admin:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ps_default:10m rate=120r/m;

# Upstream pool — keepalive lets nginx reuse TCP connections to
# uvicorn. Without this, every /api/ request opens a fresh socket;
# under scan-window load nginx exhausts ephemeral ports and the
# kernel resets new connections (104: Connection reset by peer →
# 502 Bad Gateway). 32 idle connections is more than enough for
# the single-worker uvicorn this proxies to.
upstream polyscope_api {
    server 127.0.0.1:8021;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream polyscope_web {
    server 127.0.0.1:3020;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Shared proxy settings — included via `include` is not portable across
# all nginx layouts, so they are repeated per-location below using the
# same set of directives. Header order matters: rate-limit BEFORE
# proxy_pass so 429s short-circuit the upstream call.

server {
    listen 80;
    server_name polyscope.gudman.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name polyscope.gudman.xyz;

    # SSL certs managed by certbot
    ssl_certificate /etc/letsencrypt/live/polyscope.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyscope.gudman.xyz/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # X-XSS-Protection is deprecated and known to introduce its own
    # vulnerabilities in older browsers; disable it explicitly and
    # rely on CSP below for defense-in-depth.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP — 'unsafe-inline' on script-src is needed by the theme
    # pre-paint script in app/layout.tsx; everything else is locked down.
    # connect-src includes Polymarket (gamma, clob, public site for
    # geoblock check) and Polygon RPC for on-chain reads from the
    # browser wallet flow.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://gamma-api.polymarket.com https://clob.polymarket.com https://polymarket.com https://polygon-rpc.com wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Upstream timeouts — uvicorn worker can take a few seconds when a
    # cold-cache stats endpoint is computing. Reads must outlive that
    # plus a small margin or nginx returns 504.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # ── US geoblock for trade-facilitation surfaces ─────────────────
    # Polymarket's CLOB blocks US server-side; PolyScope mirrors that
    # restriction on every endpoint that produces trade-execution data
    # or surfaces the trading UI. Read-only intelligence (homepage,
    # /smart-money, /traders, /methodology, /portfolio, /api/divergences,
    # etc.) stays open — only the trade-flow choke points are gated.
    # $geoip2_country_iso_code defined in /etc/nginx/conf.d/geoip2.conf.
    # 451 = Unavailable for Legal Reasons.

    location ~ ^/api/market/[^/]+/trade$ {
        if ($geoip2_country_iso_code = US) {
            return 451;
        }
        limit_req zone=ps_default burst=240 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/orders/place {
        if ($geoip2_country_iso_code = US) {
            return 451;
        }
        limit_req zone=ps_admin burst=60 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /builder {
        if ($geoip2_country_iso_code = US) {
            return 451;
        }
        proxy_pass http://polyscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limited admin/auth surfaces. Apply tighter zones FIRST so
    # nginx's longest-match wins.
    location = /api/wallet/link {
        limit_req zone=ps_wallet_link burst=20 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/events {
        limit_req zone=ps_events burst=120 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/orders/ {
        limit_req zone=ps_admin burst=60 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        limit_req zone=ps_admin burst=60 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (general)
    location /api/ {
        limit_req zone=ps_default burst=240 nodelay;
        proxy_pass http://polyscope_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://polyscope_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
