# GeoIP2 — country lookup for $geoip2_country_iso_code.
#
# Lives in /etc/nginx/conf.d/ so it's loaded into the http{} context
# of every server block. The DB file is refreshed monthly via cron;
# auto_reload picks up the new file without an nginx restart.
geoip2 /etc/nginx/geoip/dbip-country-lite.mmdb {
    auto_reload 5m;
    $geoip2_country_iso_code default=XX country iso_code;
}
